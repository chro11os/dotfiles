font_family      Iosevka Nerd Font
font_size        14.0

macos_option_as_alt   yes
confirm_os_window_close 0
tab_bar_style         powerline

# images: kitty graphics protocol is built in (`kitten icat img.png`)
clipboard_control write-clipboard write-primary read-clipboard read-primary

map cmd+shift+equal        new_tab_with_cwd
map cmd+shift+plus         new_tab_with_cwd
map cmd+shift+[  previous_tab
map cmd+shift+] next_tab
# theme: dark-theme.auto.conf / light-theme.auto.conf follow macOS appearance
map cmd+{  previous_tab
map cmd+}  next_tab

remember_window_size  no
initial_window_width  100c
initial_window_height 30c
map cmd+shift+minus  close_tab
map cmd+_            close_tab

# OS-specific maps (KITTY_OS is linux or macos)
include ${KITTY_OS}.conf
